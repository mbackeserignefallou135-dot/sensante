<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenSante - Pre-diagnostic</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">

<!-- HEADER -->
<header class="bg-blue-600 text-white py-4 shadow-lg">
  <div class="max-w-4xl mx-auto px-4">
    <h1 class="text-2xl font-bold">SenSante</h1>
    <p class="text-blue-100 text-sm">Assistant pre-diagnostic médical</p>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-4xl mx-auto px-4 py-8">

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

<!-- FORM -->
<div id="form-section" class="bg-white rounded-xl shadow-md p-6">

<h2 class="text-xl font-bold mb-4">Symptômes du patient</h2>

<input id="age" type="number" placeholder="Age" class="w-full border p-2 rounded mb-3">

<select id="sexe" class="w-full border p-2 rounded mb-3">
  <option value="F">Femme</option>
  <option value="M">Homme</option>
</select>

<input id="temperature" type="number" step="0.1" placeholder="Température" class="w-full border p-2 rounded mb-3">

<input id="tension_sys" type="number" placeholder="Tension" class="w-full border p-2 rounded mb-3">

<div class="mb-3">
<label><input type="checkbox" id="toux"> Toux</label><br>
<label><input type="checkbox" id="fatigue"> Fatigue</label><br>
<label><input type="checkbox" id="maux_tete"> Maux de tête</label>
</div>

<select id="region" class="w-full border p-2 rounded mb-3">
  <option>Dakar</option>
  <option>Thies</option>
  <option>Saint-Louis</option>
</select>

<button onclick="diagnostiquer()" class="w-full bg-blue-600 text-white py-2 rounded">
Diagnostiquer
</button>

</div>

<!-- RESULT -->
<div id="result-section" class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400">
<p class="text-4xl mb-3">🩺</p>
<p>Remplissez le formulaire puis cliquez sur Diagnostiquer</p>
</div>

</div>
</main>

<!-- SCRIPT -->
<script>

const API_URL = "http://localhost:8000";

async function diagnostiquer() {

const patient = {
age: parseInt(document.getElementById("age").value),
sexe: document.getElementById("sexe").value,
temperature: parseFloat(document.getElementById("temperature").value),
tension_sys: parseInt(document.getElementById("tension_sys").value),
toux: document.getElementById("toux").checked,
fatigue: document.getElementById("fatigue").checked,
maux_tete: document.getElementById("maux_tete").checked,
region: document.getElementById("region").value
};

document.getElementById("result-section").innerHTML =
"<p>Analyse en cours...</p>";

try {
const response = await fetch(API_URL + "/predict", {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify(patient)
});

const result = await response.json();
afficherResultat(result);

} catch (error) {
document.getElementById("result-section").innerHTML =
"<p>Erreur de connexion</p>";
}
}

function afficherResultat(r) {

document.getElementById("result-section").innerHTML = `
<div>
<h2 class="text-xl font-bold mb-2">Résultat</h2>

<p><b>Diagnostic :</b> ${r.diagnostic}</p>
<p><b>Probabilité :</b> ${Math.round(r.probabilite * 100)}%</p>
<p><b>Confiance :</b> ${r.confiance}</p>
<p class="mt-2 text-gray-600">${r.message}</p>
</div>
`;

demanderExplication(r);
}

async function demanderExplication(data) {

const explainData = {
diagnostic: data.diagnostic,
probabilite: data.probabilite,
age: parseInt(document.getElementById("age").value),
sexe: document.getElementById("sexe").value,
temperature: parseFloat(document.getElementById("temperature").value),
region: document.getElementById("region").value
};

const section = document.getElementById("result-section");

const div = document.createElement("div");
div.innerHTML = "<p>Explication en cours...</p>";
section.appendChild(div);

try {
const response = await fetch(API_URL + "/explain", {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify(explainData)
});

const res = await response.json();

div.innerHTML = `
<div class="mt-4 p-3 bg-purple-50 border rounded">
<p class="font-bold text-purple-700">Explication IA</p>
<p>${res.explication}</p>
</div>
`;

} catch (e) {
div.innerHTML = "<p>Explication indisponible</p>";
}
}

</script>

</body>
</html>
